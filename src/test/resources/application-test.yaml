spring.cache.type: none

spring:
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog-test.sql"
  config:
    activate:
      on-profile: test


  datasource:

    url: ${DB_TEST_URL}
    username: ${DB_TEST_USERNAME}
    password: ${DB_TEST_PASSWORD}
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none # Автоматически создавать и удалять схему
  h2:
    console:
      enabled: true # Включить консоль H2 (для отладки)
      path: /h2-console # URL для доступа к консоли

